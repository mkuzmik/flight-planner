<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Planner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               background: #f0f4f8; color: #1a1a2e; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        h1 { font-size: 1.8rem; margin-bottom: 1.5rem; color: #1e3a5f; }

        .card { background: white; border-radius: 12px; padding: 1.5rem;
                box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 1.5rem; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
        label { display: block; font-size: 0.82rem; font-weight: 600; color: #555; margin-bottom: 0.3rem; }
        label small { font-weight: 400; }

        input[type=text], input[type=number], input[type=file] {
            width: 100%; padding: 0.5rem 0.75rem; border: 1.5px solid #dde1e8; border-radius: 8px;
            font-size: 0.93rem; transition: border-color 0.2s; background: #fafbfc;
        }
        input:focus { outline: none; border-color: #3b82f6; background: white; }

        .btn-row { margin-top: 1.25rem; display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
        button { border: none; border-radius: 8px; padding: 0.6rem 1.4rem; font-size: 0.95rem;
                 cursor: pointer; font-weight: 600; transition: background 0.15s; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-secondary { background: #e2e8f0; color: #374151; }
        .btn-secondary:hover { background: #cbd5e1; }

        #status { min-height: 1.4rem; margin-bottom: 0.5rem; font-size: 0.88rem; color: #64748b; }
        #status.error { color: #dc2626; }

        .info-bar { font-size: 0.83rem; color: #555; display: flex; flex-wrap: wrap; gap: 0.4rem 1.5rem; }
        .info-bar b { color: #1e3a5f; }

        table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
        thead th { background: #1e3a5f; color: white; padding: 0.55rem 0.75rem;
                   white-space: nowrap; text-align: right; }
        tbody td { padding: 0.42rem 0.75rem; border-bottom: 1px solid #e5e7eb; text-align: right; }
        tbody td:first-child, tbody td:nth-child(2),
        thead th:first-child, thead th:nth-child(2) {
            max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            text-align: left;
        }
        tbody tr:hover td { background: #eff6ff; }
        tbody tr:nth-child(even) td { background: #f8fafc; }
        tbody tr:nth-child(even):hover td { background: #eff6ff; }
        .row-invalid td { color: #dc2626; }
        .totals-row td { font-weight: 700; background: #1e3a5f !important; color: white !important; }
        .totals-row td:not(:first-child) { text-align: right; }

        @media print {
            @page { size: A4 landscape; margin: 8mm; }
            body { background: white; }
            .container { max-width: 100%; padding: 0; }
            .card:first-child { display: none; }
            #status { display: none; }
            .btn-row { display: none; }
            .card { padding: 0; box-shadow: none; border-radius: 0; margin-bottom: 0.5rem; }
            h1 { font-size: 1.1rem; margin-bottom: 0.4rem; }
            .info-bar { font-size: 0.75rem; margin-bottom: 0.4rem; }
            table { font-size: 0.72rem; width: 100%; table-layout: fixed; }
            thead th { white-space: normal; padding: 0.25rem 0.3rem; }
            tbody td { padding: 0.25rem 0.3rem; }
            thead th:nth-child(1), thead th:nth-child(2),
            tbody td:nth-child(1), tbody td:nth-child(2) {
                max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>✈ Flight Planner</h1>

    <div class="card">
        <div class="form-grid">
            <div>
                <label>GPX File</label>
                <input type="file" id="gpxFile" accept=".gpx">
            </div>
            <div>
                <label>Wind Direction <small>(°mag)</small></label>
                <input type="number" id="windDir" placeholder="e.g. 270" min="0" max="360" step="1">
            </div>
            <div>
                <label>Wind Speed <small>(kt)</small></label>
                <input type="number" id="windSpeed" placeholder="e.g. 15" min="0" step="1" value="0">
            </div>
            <div>
                <label>TAS <small>(kt)</small></label>
                <input type="number" id="tas" placeholder="e.g. 100" min="1" step="1">
            </div>
            <div>
                <label>Fuel Consumption <small>(gal/h)</small></label>
                <input type="number" id="fuelGph" placeholder="e.g. 6.5" min="0.1" step="0.1">
            </div>
            <div>
                <label>Taxi/Runup Fuel <small>(gal)</small></label>
                <input type="number" id="taxiFuel" placeholder="e.g. 1.5" min="0" step="0.1" value="0">
            </div>
            <div>
                <label>Climb Fuel <small>(gal, ×2 for go-around)</small></label>
                <input type="number" id="climbFuel" placeholder="e.g. 2.0" min="0" step="0.1" value="0">
            </div>
            <div>
                <label>Fuel Reserve</label>
                <select id="reserveMin" style="width:100%;padding:0.5rem 0.75rem;border:1.5px solid #dde1e8;border-radius:8px;font-size:0.93rem;background:#fafbfc;">
                    <option value="45" selected>45 min (VFR day)</option>
                    <option value="60">60 min (extended)</option>
                </select>
            </div>
            <div>
                <label>Alternate Airport <small>(ICAO, optional)</small></label>
                <input type="text" id="alternateIcao" placeholder="e.g. EPMO" maxlength="4"
                       style="text-transform:uppercase">
            </div>
        </div>
        <div class="btn-row">
            <button class="btn-primary" id="calcBtn">Calculate Plan</button>
            <button class="btn-secondary" id="dryRunBtn">⚡ Dry Run</button>
            <button class="btn-secondary" id="printBtn">🖨 Print</button>
        </div>
    </div>

    <div id="status"></div>

    <div id="results" style="display:none">
        <div class="card" style="padding: 0.9rem 1.5rem; margin-bottom: 1rem;">
            <div class="info-bar" id="infoBar"></div>
        </div>
        <div class="card" style="overflow-x: auto; padding: 0;">
            <table id="planTable"></table>
        </div>
        <div class="card" id="fuelSummary" style="margin-top: 1rem;"></div>
    </div>
</div>

<script type="module">
import { parseGpx, computeLegs, computeFuelSummary, fmtTime, r0, r1, r2 } from './js/planner.js';

// ── Defaults ──────────────────────────────────────────────────────────────────
document.getElementById('calcBtn').addEventListener('click', calculate);
document.getElementById('printBtn').addEventListener('click', () => window.print());
document.getElementById('dryRunBtn').addEventListener('click', dryRun);

// ── Magnetic declination — NOAA geomag API (single call for route centroid) ───
async function fetchDeclination(lat, lon) {
    const now = new Date();
    const y = now.getUTCFullYear(), m = now.getUTCMonth() + 1, d = now.getUTCDate();
    const url = 'https://www.ngdc.noaa.gov/geomag-web/calculators/calculateDeclination'
              + `?lat1=${lat.toFixed(4)}&lon1=${lon.toFixed(4)}`
              + `&key=zNEw7&resultFormat=json`
              + `&startYear=${y}&startMonth=${m}&startDay=${d}`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`NOAA API returned ${resp.status}`);
    const json = await resp.json();
    return json.result[0].declination; // degrees, East-positive
}

// ── Alternate airport — OpenStreetMap Overpass API ───────────────────────────
async function fetchAirportCoords(icao) {
    const code = icao.trim().toUpperCase();
    if (!/^[A-Z]{4}$/.test(code)) throw new Error(`Invalid ICAO code: "${icao}"`);
    const query = `[out:json];(node["icao"="${code}"];way["icao"="${code}"];relation["icao"="${code}"];);out center;`;
    const url   = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(query);
    const resp  = await fetch(url);
    if (!resp.ok) throw new Error(`Overpass API returned ${resp.status}`);
    const json  = await resp.json();
    // Prefer way/relation (has .center), fall back to node (has .lat/.lon directly)
    const el = json.elements.find(e => e.center?.lat != null)
            ?? json.elements.find(e => e.lat != null);
    if (!el) throw new Error(`Airport ${code} not found in OpenStreetMap`);
    const lat  = el.center?.lat ?? el.lat;
    const lon  = el.center?.lon ?? el.lon;
    const name = el.tags?.name ?? code;
    return { lat, lon, name, icao: code };
}


async function dryRun() {
    document.getElementById('windDir').value       = 270;
    document.getElementById('windSpeed').value     = 15;
    document.getElementById('tas').value           = 100;
    document.getElementById('fuelGph').value       = 6.5;
    document.getElementById('taxiFuel').value      = 1.5;
    document.getElementById('climbFuel').value     = 2.0;
    document.getElementById('reserveMin').value    = 45;
    document.getElementById('alternateIcao').value = 'EPNC';

    const resp = await fetch('assets/example_flight_log.gpx');
    if (!resp.ok) return err('Could not load example GPX file.');
    await run(await resp.text(), 270, 15, 100, 6.5, 1.5, 2.0, 45, 'EPNC');
}

// ── Main entry point ──────────────────────────────────────────────────────────
async function calculate() {
    const file         = document.getElementById('gpxFile').files[0];
    const windDir      = parseFloat(document.getElementById('windDir').value);
    const windSpeed    = parseFloat(document.getElementById('windSpeed').value);
    const tas          = parseFloat(document.getElementById('tas').value);
    const fuelGph      = parseFloat(document.getElementById('fuelGph').value);
    const taxiFuel     = parseFloat(document.getElementById('taxiFuel').value)  || 0;
    const climbFuel    = parseFloat(document.getElementById('climbFuel').value) || 0;
    const reserveMin   = parseFloat(document.getElementById('reserveMin').value);
    const alternateIcao = document.getElementById('alternateIcao').value.trim();

    if (!file)                                          return err('Please select a GPX file.');
    if (isNaN(windDir) || windDir < 0 || windDir > 360) return err('Wind direction: 0–360°');
    if (isNaN(windSpeed) || windSpeed < 0)              return err('Wind speed must be ≥ 0.');
    if (isNaN(tas) || tas <= 0)                         return err('TAS must be > 0.');
    if (isNaN(fuelGph) || fuelGph <= 0)                 return err('Fuel consumption must be > 0.');

    await run(await file.text(), windDir, windSpeed, tas, fuelGph, taxiFuel, climbFuel, reserveMin, alternateIcao);
}

// ── Shared calculation core ───────────────────────────────────────────────────
async function run(gpxText, windDir, windSpeed, tas, fuelGph, taxiFuel = 0, climbFuel = 0, reserveMin = 45, alternateIcao = '') {
    const btn = document.getElementById('calcBtn');
    document.getElementById('results').style.display = 'none';
    document.getElementById('status').className = '';
    btn.disabled = true;
    setStatus('Parsing GPX…');

    try {
        const points = parseGpx(gpxText);

        setStatus('Fetching magnetic declination from NOAA…');
        const cLat = points.reduce((s, p) => s + p.lat, 0) / points.length;
        const cLon = points.reduce((s, p) => s + p.lon, 0) / points.length;
        let declination;
        try {
            declination = await fetchDeclination(cLat, cLon);
            setStatus(`Declination: ${declination.toFixed(2)}° (NOAA IGRF)`);
        } catch (e) {
            return err('Could not fetch declination from NOAA (' + e.message + ').');
        }

        // Alternate airport — isolated so failures don't abort main plan
        let altInfo = null; // { fuel, label, warning }
        const icaoCode = alternateIcao.trim().toUpperCase();
        if (icaoCode) {
            setStatus(`Looking up alternate ${icaoCode}…`);
            try {
                const airport = await fetchAirportCoords(icaoCode);
                const lastPt  = points[points.length - 1];
                const [altLeg] = computeLegs([lastPt, { ...airport, ele: 0 }],
                                              windDir, windSpeed, tas, fuelGph, declination);
                if (!isFinite(altLeg.gs) || altLeg.gs <= 0) {
                    altInfo = { fuel: 0, label: `${icaoCode} – ${airport.name}`,
                                warning: `Alternate leg to ${icaoCode} has invalid ground speed — fuel not included.` };
                } else {
                    const fuel = altLeg.fuel + climbFuel; // leg + go-around at alternate
                    altInfo = { fuel, label: `${icaoCode} – ${airport.name}`,
                                nm: altLeg.dist, ete: altLeg.eteH };
                }
                setStatus(`Declination: ${declination.toFixed(2)}° (NOAA IGRF)`);
            } catch (e) {
                altInfo = { fuel: 0, label: icaoCode,
                            warning: `Could not look up alternate ${icaoCode}: ${e.message}` };
                setStatus(`Declination: ${declination.toFixed(2)}° (NOAA IGRF)`);
            }
        }

        renderResults(computeLegs(points, windDir, windSpeed, tas, fuelGph, declination),
                      declination, windDir, windSpeed, tas, fuelGph, taxiFuel, climbFuel, reserveMin, altInfo);
    } catch (e) {
        err(e.message);
    } finally {
        btn.disabled = false;
    }
}

function setStatus(msg, isErr = false) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = isErr ? 'error' : '';
}

function err(msg) {
    setStatus(msg, true);
    document.getElementById('calcBtn').disabled = false;
}

// ── Render results ────────────────────────────────────────────────────────────
function renderResults(legs, decl, windDir, windSpeed, tas, fuelGph, taxiFuel, climbFuel, reserveMin, altInfo = null) {
    const infoParts = [
        `Wind: <b>${windDir}°/${windSpeed}kt</b>`,
        `TAS: <b>${tas}kt</b>`,
        `Fuel: <b>${fuelGph} gal/h</b>`,
        `Declination: <b>${decl.toFixed(2)}°</b>`,
    ].join(' &thinsp;·&thinsp; ');
    document.getElementById('infoBar').innerHTML = infoParts;

    const cols = ['FROM', 'TO', 'TC', '(-)DECL', 'MC', 'WCA', 'MH', 'NM', 'GS (kt)', 'ETE', 'Fuel (gal)'];
    let html = '<thead><tr>' + cols.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';

    let totDist = 0, totFuel = 0, totTime = 0;
    let hasInvalid = false;

    for (const leg of legs) {
        const ok = isFinite(leg.gs) && leg.gs > 0;
        if (ok) { totFuel += leg.fuel; totTime += leg.eteH; }
        else hasInvalid = true;
        html += `<tr${ok ? '' : ' class="row-invalid"'}>
            <td>${leg.from}</td>
            <td>${leg.to}</td>
            <td>${r0(leg.tc)}°</td>
            <td>${r0(leg.negDecl)}°</td>
            <td>${r0(leg.mc)}°</td>
            <td>${r0(leg.wca)}°</td>
            <td>${ok ? r0(leg.mh) + '°' : '—'}</td>
            <td>${r1(leg.dist)}</td>
            <td>${ok ? r1(leg.gs) : '—'}</td>
            <td>${ok ? fmtTime(leg.eteH) : '—'}</td>
            <td>${ok && isFinite(leg.fuel) ? r2(totFuel) : '—'}</td>
        </tr>`;
        totDist += leg.dist;
    }

    html += `<tr class="totals-row">
        <td colspan="7">TOTAL</td>
        <td>${r1(totDist)}</td>
        <td>—</td>
        <td>${fmtTime(totTime)}</td>
        <td>${r2(totFuel)}</td>
    </tr></tbody>`;

    document.getElementById('planTable').innerHTML = html;

    // Fuel summary
    const alternateFuel = altInfo?.fuel ?? 0;
    const s = computeFuelSummary({ tripFuel: totFuel, taxiFuel, climbFuel, fuelGph, reserveMin, alternateFuel });
    const warnings = [];
    if (hasInvalid) warnings.push('⚠ Some legs are invalid — trip fuel may be incomplete.');
    if (altInfo?.warning) warnings.push(`⚠ ${altInfo.warning}`);
    const warnHtml = warnings.map(w => `<p style="color:#dc2626;font-size:0.82rem;margin-bottom:0.4rem">${w}</p>`).join('');
    const row = (label, value, note = '') =>
        `<tr><td style="padding:0.3rem 0.5rem;color:#555">${label}</td>` +
        `<td style="padding:0.3rem 0.5rem;text-align:right;font-variant-numeric:tabular-nums">${value} gal</td>` +
        `<td style="padding:0.3rem 0.5rem;font-size:0.78rem;color:#94a3b8">${note}</td></tr>`;
    const altRow = altInfo && !altInfo.warning
        ? row(`Alternate ${altInfo.label}`, r2(s.alternateFuel),
              `${r1(altInfo.nm)} NM · ${fmtTime(altInfo.ete)} · incl. go-around`)
        : '';
    document.getElementById('fuelSummary').innerHTML =
        `<h3 style="font-size:0.95rem;font-weight:700;color:#1e3a5f;margin-bottom:0.6rem">Fuel Summary</h3>` +
        warnHtml +
        `<table style="border-collapse:collapse;font-size:0.88rem"><tbody>` +
        row('Trip fuel',    r2(s.tripFuel)) +
        row('Taxi / runup', r2(s.taxiFuel)) +
        row('Climb fuel',   r2(s.climbTotal), `${r2(s.climbFuel)} gal × 2 (departure + dest. go-around)`) +
        altRow +
        row('Holding (10 min)', r2(s.holdingFuel)) +
        row(`Reserve (${s.reserveMin} min)`, r2(s.reserveFuel)) +
        `<tr style="border-top:2px solid #1e3a5f"><td style="padding:0.4rem 0.5rem;font-weight:700">Total required</td>` +
        `<td style="padding:0.4rem 0.5rem;text-align:right;font-weight:700;font-variant-numeric:tabular-nums">${r2(s.total)} gal</td>` +
        `<td style="padding:0.4rem 0.5rem;font-weight:700;color:#1e3a5f">${r1(s.total * 3.78541)} L</td></tr>` +
        `</tbody></table>`;

    document.getElementById('results').style.display = 'block';
}
</script>
</body>
</html>
